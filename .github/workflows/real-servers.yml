name: real language servers

# The `#[ignore]`d LSP tests, run against servers that are actually installed.
#
# They are ignored for a good reason — each one spawns a real server, which the canonical gate has
# no business doing on every push — and that reason is also how they rot: nothing ran them, so a
# TypeScript adapter that reported every `.ts` file as clean sat green for months. An ignored test
# nobody runs is worth roughly nothing.
#
# So: weekly, and on demand, off the PR path entirely. What it catches is drift *underneath* Luxe —
# a server that changed its handshake, a language whose toolchain moved to a protocol Luxe does not
# speak — which is a class of failure no amount of stub testing sees, and which arrives on a
# calendar rather than in a diff.
on:
  schedule:
    - cron: "0 7 * * 1" # Mondays, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-servers-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "3"
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  servers:
    name: lsp against installed servers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable + rust-analyzer)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rust-analyzer

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install nextest
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: nextest

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Every test here skips itself when its server is absent, so this list is what gets covered
      # rather than what is required. `typescript` is installed beside its language server because
      # `typescript-language-server` is a driver and does nothing without one.
      - name: Install language servers
        run: |
          npm i -g typescript typescript-language-server pyright \
            bash-language-server yaml-language-server vscode-langservers-extracted \
            svelte-language-server
          go install golang.org/x/tools/gopls@latest
          echo "$(go env GOPATH)/bin" >>"${GITHUB_PATH}"

      - name: Which servers answered
        run: |
          for server in rust-analyzer typescript-language-server tsc pyright-langserver \
            gopls clangd bash-language-server yaml-language-server \
            vscode-json-language-server svelteserver; do
            printf '%-32s %s\n' "${server}" "$(command -v "${server}" || echo 'not installed')"
          done

      # Serially: several of these index a project, and a runner with two cores running six
      # language servers at once measures the runner rather than the adapter.
      - name: Real-server suite
        run: >
          cargo nextest run -p luxe-lsp --locked --run-ignored all
          --test-threads 1 --no-fail-fast -E 'test(/real_/)'
