  <text x="0" y="259.0" textLength="1090" lengthAdjust="spacingAndGlyphs" xml:space="preserve"><tspan> </tspan><tspan> </tspan><tspan>  </tspan><tspan fill="#97938c">Use </tspan><tspan fill="#faaa51">luxe --with-tool &lt;name&gt;</tspan><tspan fill="#97938c"> or </tspan><tspan fill="#faaa51">luxe --no-tool &lt;name&gt;</tspan><tspan fill="#97938c"> to turn one on or off for a single session.</tspan><tspan>         </tspan></text>
