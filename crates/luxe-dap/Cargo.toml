[package]
name = "luxe-dap"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Debug Adapter Protocol client for Luxe: breakpoints, stepping, and variable inspection"
repository.workspace = true
homepage.workspace = true

# Allowed edges: depends on luxe-core only (sibling of luxe-lsp).
# Provides a native Debug Adapter Protocol client + the `debug` tool.

[dependencies]
luxe-core = { path = "../luxe-core", version = "0.1.1" }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net"] }
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
