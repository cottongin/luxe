[package]
name = "luxe-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Language-server client and offline code graph for Luxe: diagnostics, navigation, and blast radius"
repository.workspace = true
homepage.workspace = true

# Allowed edges: depends on luxe-core only.
# Provides a generic LSP client (rust-analyzer first).

[dependencies]
luxe-core = { path = "../luxe-core", version = "0.1.2" }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = "0.1"
tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-go = { workspace = true }
streaming-iterator = { workspace = true }
# Content-addressed graph cache shard hashing, and the hex it is written as — `sha2` 0.11 returns
# a `hybrid_array::Array`, which has no `LowerHex`, so `{:x}` is no longer an option.
sha2 = "0.11"
base16ct = { version = "1", features = ["alloc"] }
# `file://` URIs. The protocol's spelling is not "file://" + the path: drive letters, UNC shares and
# percent-encoding are all real, and hand-rolling them is how every LSP feature broke on Windows.
url = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
