[package]
name = "luxe-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A coding agent for your terminal."
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["ai", "agent", "llm", "tui", "coding-assistant"]
categories = ["command-line-utilities", "development-tools"]

# Binary crate — the entry point. Depends on all workspace crates.
# `anyhow` is allowed here (binary boundary); libraries use `thiserror`.

[[bin]]
name = "luxe"
path = "src/main.rs"

[dependencies]
luxe-core = { path = "../luxe-core", version = "0.1.4" }
luxe-providers = { path = "../luxe-providers", version = "0.1.4" }
luxe-tools = { path = "../luxe-tools", version = "0.1.4" }
luxe-lsp = { path = "../luxe-lsp", version = "0.1.4" }
luxe-dap = { path = "../luxe-dap", version = "0.1.4" }
luxe-mcp = { path = "../luxe-mcp", version = "0.1.4" }
luxe-tui = { path = "../luxe-tui", version = "0.1.4" }
luxe-remote = { path = "../luxe-remote", version = "0.1.4", optional = true }
# The pairing QR in the terminal. Without its defaults it is the encoder and text renderer alone,
# with no dependencies.
qrcode = { version = "0.14", default-features = false, optional = true }
anyhow = { workspace = true }
clap = { workspace = true }
shlex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# `signal`: `luxe remote` runs until Ctrl-C, and stops serving cleanly when it comes
tokio = { workspace = true, features = ["signal"] }
uuid = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
# A joiner's transcript is encoded from the shared snapshot through a borrowed copy of its shape
serde = { workspace = true }
async-trait = { workspace = true }
# One request, for the update notice: a public release manifest, carrying nothing about the user.
# See `luxe_core::update` for why that constraint is load-bearing rather than a nicety.
reqwest = { workspace = true }
# `luxe auth login` reads an API key without echoing it, which needs raw mode on the real terminal.
# Pinned to luxe-tui's version so there is exactly one crossterm in the tree.
crossterm = "0.29"
# The loop view cuts each line to the terminal's width, so it can redraw a line in place
unicode-width = { workspace = true }
# Streaming the update manifest with a size cap, and comparing the version it reports.
futures = { workspace = true }
semver = { workspace = true }

[dev-dependencies]
tempfile = "3"
# The guide check: what luxe would silently ignore in a config example
serde_ignored = "0.1"

[features]
default = ["clipboard-images", "remote"]
# `luxe remote`, the only server in luxe. A packager can leave it out to ship a luxe with no
# server code at all.
remote = ["dep:luxe-remote", "dep:qrcode"]
clipboard = ["luxe-tui/clipboard"]
clipboard-images = ["luxe-tui/clipboard-images"]

[lints]
workspace = true
