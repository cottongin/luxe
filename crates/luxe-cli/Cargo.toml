[package]
name = "luxe-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A terminal coding agent: streaming chat, tools, guided diff review, and LSP/DAP code intelligence"
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["ai", "agent", "llm", "tui", "coding-assistant"]
categories = ["command-line-utilities", "development-tools"]

# Binary crate — the entry point. Depends on all workspace crates.
# `anyhow` is allowed here (binary boundary); libraries use `thiserror`.

[[bin]]
name = "luxe"
path = "src/main.rs"

[dependencies]
luxe-core = { path = "../luxe-core", version = "0.1.1" }
luxe-providers = { path = "../luxe-providers", version = "0.1.1" }
luxe-tools = { path = "../luxe-tools", version = "0.1.1" }
luxe-lsp = { path = "../luxe-lsp", version = "0.1.1" }
luxe-dap = { path = "../luxe-dap", version = "0.1.1" }
luxe-mcp = { path = "../luxe-mcp", version = "0.1.1" }
luxe-tui = { path = "../luxe-tui", version = "0.1.1" }
anyhow = { workspace = true }
clap = { workspace = true }
shlex = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
# One request, for the update notice: a public release manifest, carrying nothing about the user.
# See `luxe_core::update` for why that constraint is load-bearing rather than a nicety.
reqwest = { workspace = true }
# `luxe auth login` reads an API key without echoing it, which needs raw mode on the real terminal.
# Pinned to luxe-tui's version so there is exactly one crossterm in the tree.
crossterm = "0.29"
# Streaming the update manifest with a size cap, and comparing the version it reports.
futures = { workspace = true }
semver = { workspace = true }

[dev-dependencies]
tempfile = "3"
# The guide check: what Luxe would silently ignore in a config example
serde_ignored = "0.1"
serde = { workspace = true }

[features]
default = ["clipboard-images"]
clipboard = ["luxe-tui/clipboard"]
clipboard-images = ["luxe-tui/clipboard-images"]

[lints]
workspace = true
