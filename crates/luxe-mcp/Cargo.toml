[package]
name = "luxe-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Model Context Protocol client for luxe: stdio and HTTP transports, with OAuth for hosted servers"
repository.workspace = true
homepage.workspace = true

# Allowed edges: depends on luxe-core only (sibling of luxe-lsp/luxe-dap).
# Owns MCP orchestration: the single `mcp` proxy tool, a lazy per-server lifecycle manager with a
# persisted tool-metadata cache, and (later slices) the HTTP/SSE transport + OAuth that core's
# no-HTTP rule forbids in core itself. The low-level stdio transport stays in luxe-core.

[dependencies]
luxe-core = { path = "../luxe-core", version = "0.1.4" }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = "0.1"
reqwest = { workspace = true }
futures-util = "0.3"
# OAuth: URL building and in-memory secret hygiene for stored tokens. PKCE and the loopback
# listener are `luxe_core::oauth_loopback`.
url = "2"
percent-encoding = "2"
secrecy = { workspace = true }
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
